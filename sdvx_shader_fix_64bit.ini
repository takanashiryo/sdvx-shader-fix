[sdvx_shader_fix]
log=1
; 1 = also log every D3DXCompileShader call (noisy). fallback/force_fxc lines still log when log=1.
log_verbose=0
enabled=1
; 1 = supply fxc-precompiled bytecode for known RGB/Pseudo3d/AFP/Cubism sources
; when D3DXCompileShader fails (or always, if force_fxc=1).
fallback=1
; 1 = replace successful compiles with validated fxc blobs too so VS/PS match.
force_fxc=1
